<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

tainer": "#93000a", "on-secondary-fixed": "#1c1b1b" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xs": "0.25rem", "margin": "1rem", "space-sm": "0.5rem", "space-xl": "2rem", "space-md": "1rem", "space-lg": "1.5rem", "gutter": "1rem" }, "fontFamily": { "headline-md": ["Noto Sans"], "body-lg": ["Noto Sans"], "title-md": ["Noto Sans"], "body-md": ["Noto Sans"], "label-lg": ["Noto Sans"], "label-md": ["Noto Sans"], "display-lg": ["Noto Sans"], "headline-sm": ["Noto Sans"], "label-sm": ["Noto Sans"], "body-sm": ["Noto Sans"], "headline-lg": ["Noto Sans"] }, "fontSize": { "headline-md": ["22px", { "lineHeight": "32px", "fontWeight": "600" }], "body-lg": ["18px", { "lineHeight": "30px", "fontWeight": "400" }], "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "body-md": ["15px", { "lineHeight": "24px", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "display-lg": ["32px", { "lineHeight": "44px", "fontWeight": "700" }], "headline-sm": ["18px", { "lineHeight": "28px", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }], "body-sm": ["13px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["26px", { "lineHeight": "36px", "fontWeight": "700" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe" style="background-color: rgb(251, 246, 238); color: rgb(62, 42, 30);"><main class="flex flex-col relative w-full bg-surface min-h-screen" style="background-color: rgb(251, 246, 238);"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Brand & Mascot Header -->
<div class="flex flex-col items-center text-center pt-space-md pb-space-lg">
<!-- Emblem Container with gentle warm glow -->
<div class="relative flex items-center justify-center w-24 h-24 mb-space-sm rounded-full bg-surface-container-high shadow-sm">
<img alt="شعار تطبيق اقرأ" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAxWENKg1QrG8h1ZvGZ-d0R2gHFn5qIcvJQninmttBC4r3VyinJJlyvQbXXvu4ouiAlaXCqVZp8tzqeEue8HRLZE-Nd7Ep8C4NRiA2IzfOyr-BZ65sB43JwRjiCw-6M0jOEzGRrBxWqnE-J1hk7r_sfYn8w5HK73jNAWQiT-0o5qxUTsj-eakvU1HxJOyWYLpzDrB3qx--3CKlKcr_eISTzOQWjcJJPT5wjBYcytg2vMCw833WiXSQzxg">
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight" style="color: rgb(62, 42, 30);">اقرأ</h1>
<p class="font-body-md text-body-md text-secondary mt-space-xs max-w-xs" style="color: rgb(79, 93, 47);">مساحتك الهادئة لبناء عادة القراءة اليومية</p>
</div>
<!-- Interactive Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm" style="border-radius: 16px; background-color: rgb(255, 255, 255); border: 1px solid rgb(239, 229, 216); box-shadow: rgba(62, 42, 30, 0.05) 0px 4px 20px -2px;">
<!-- Title Stack -->
<div class="mb-space-lg text-right">
<h2 class="font-headline-sm text-headline-sm text-on-surface" id="auth-title" style="color: rgb(62, 42, 30);">مرحباً بك مجدداً</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-space-xs" id="auth-subtitle" style="color: rgb(79, 93, 47);">سجّل دخولك لمواصلة خطتك القرائية وتأملاتك اليومية</p>
</div>
<!-- Segmented Tab Switcher (M3 Style) -->
<div class="bg-surface-container p-1 rounded-xl flex items-center mb-space-lg" role="tablist" style="border-radius: 16px; background-color: rgb(232, 237, 224); padding: 4px;">
<button aria-selected="true" class="flex-1 py-2.5 rounded-lg font-label-lg text-label-lg transition-all duration-200 text-center shadow-sm bg-surface-container-lowest text-primary" id="tab-login" onclick="switchAuthMode('login')" role="tab" type="button" style="border-radius: 12px; min-height: 48px; background-color: rgb(107, 70, 48); color: rgb(255, 255, 255); font-weight: 600;">
        تسجيل الدخول
      </button>
<button aria-selected="false" class="flex-1 py-2.5 rounded-lg font-label-lg text-label-lg transition-all duration-200 text-center text-secondary hover:text-on-surface" id="tab-register" onclick="switchAuthMode('register')" role="tab" type="button" style="border-radius: 12px; min-height: 48px; color: rgb(79, 93, 47); font-weight: 500;">
        حساب جديد
      </button>
</div>
<!-- Auth Form -->
<form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault();">
<!-- Full Name Field (Revealed on Register) -->
<div class="hidden flex-col gap-1.5 transition-all duration-300" id="field-name-container">
<label class="font-label-md text-label-md text-on-surface-variant font-medium text-right" for="input-name">الاسم الكامل</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-space-md focus-within:bg-surface-container-lowest focus-within:shadow-sm transition-all duration-150">
<span class="material-symbols-outlined text-outline text-[22px] select-none ml-2.5">badge</span>
<input class="w-full bg-transparent py-3.5 text-on-surface placeholder:text-outline-variant font-body-md text-body-md focus:outline-none text-right" id="input-name" placeholder="مثال: يوسف الأحمدي" type="text">
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium text-right" for="input-email" style="color: rgb(79, 93, 47); font-weight: 600;">البريد الإلكتروني</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-space-md focus-within:bg-surface-container-lowest focus-within:shadow-sm transition-all duration-150" style="border-radius: 16px; border: 1.5px solid rgb(205, 170, 133); background-color: rgb(250, 246, 240); min-height: 48px;">
<span class="material-symbols-outlined text-outline text-[22px] select-none ml-2.5">mail</span>
<input autocomplete="email" class="w-full bg-transparent py-3.5 text-on-surface placeholder:text-outline-variant font-body-md text-body-md focus:outline-none text-right" dir="ltr" id="input-email" placeholder="reader@iqra.app" type="email" style="color: rgb(62, 42, 30); min-height: 48px;">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="input-password" style="color: rgb(79, 93, 47); font-weight: 600;">كلمة المرور</label>
<a class="font-label-sm text-label-sm text-tertiary hover:underline text-left transition-colors" href="#" id="forgot-password-link" style="color: rgb(79, 93, 47); font-weight: 600;">
            نسيت كلمة المرور؟
          </a>
</div>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-space-md focus-within:bg-surface-container-lowest focus-within:shadow-sm transition-all duration-150" style="border-radius: 16px; border: 1.5px solid rgb(205, 170, 133); background-color: rgb(250, 246, 240); min-height: 48px;">
<span class="material-symbols-outlined text-outline text-[22px] select-none ml-2.5">lock</span>
<input class="w-full bg-transparent py-3.5 text-on-surface placeholder:text-outline-variant font-body-md text-body-md focus:outline-none text-right" id="input-password" placeholder="••••••••" type="password" style="color: rgb(62, 42, 30); min-height: 48px;">
<button aria-label="عرض أو إخفاء كلمة المرور" class="p-2 -mr-1.5 text-outline hover:text-on-surface transition-colors flex items-center justify-center rounded-full" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Primary CTA -->
<button class="w-full mt-space-xs h-[50px] bg-primary text-on-primary rounded-xl font-label-lg text-label-lg shadow-sm hover:opacity-95 active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-space-xs" id="btn-submit" type="submit" style="background: linear-gradient(135deg, rgb(107, 70, 48) 0%, rgb(130, 86, 60) 100%); border-radius: 16px; min-height: 50px; color: rgb(255, 255, 255); box-shadow: rgba(107, 70, 48, 0.25) 0px 4px 14px;">
<span id="submit-text" class="">تسجيل الدخول</span>
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
</button>
</form>
<!-- Visual Separator -->
<div class="relative flex items-center my-space-lg">
<div class="flex-grow h-px bg-surface-container-highest"></div>
<span class="px-space-sm font-label-md text-label-md text-outline bg-surface-container-lowest">أو المتابعة عبر</span>
<div class="flex-grow h-px bg-surface-container-highest"></div>
</div>
<!-- Google Authentication Button -->
<button class="w-full h-12 bg-surface-container-low hover:bg-surface-container text-on-surface rounded-xl font-label-lg text-label-lg shadow-sm active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-space-sm" type="button" style="border-radius: 16px; min-height: 48px; border: 1.5px solid rgb(205, 170, 133); background-color: rgb(255, 255, 255); color: rgb(62, 42, 30); font-weight: 600;">
<!-- Crisp inline Google "G" standard branding icon -->
<svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
<path d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z" fill="#EA4335"></path>
<path d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z" fill="#4285F4"></path>
<path d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2c0 2.8.7 5.5 1.9 7.8l3.7-2.9c-.2-.7-.4-1.5-.4-2.3z" fill="#FBBC05"></path>
<path d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 6.3 10.1 6.3z" fill="#34A853"></path>
</svg>
<span class="">المتابعة باستخدام Google</span>
</button>
</div>
<!-- Bottom Inline Switcher -->
<div class="mt-space-lg text-center flex items-center justify-center gap-1.5">
<span class="font-body-md text-body-md text-secondary" id="switch-prompt-text" style="color: rgb(79, 93, 47);">ليس لديك حساب؟</span>
<button class="font-label-lg text-label-lg text-primary hover:underline font-bold transition-all focus:outline-none" id="switch-action-btn" onclick="toggleAuthMode()" type="button" style="color: rgb(107, 70, 48); min-height: 48px;">
      إنشاء حساب جديد
    </button>
</div>
<!-- Decorative Warm Quote / Micro-Delight State -->

</div>
<script>
  let currentMode = 'login';

  function switchAuthMode(mode) {
    currentMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const nameField = document.getElementById('field-name-container');
    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');
    const submitText = document.getElementById('submit-text');
    const forgotLink = document.getElementById('forgot-password-link');
    const switchPrompt = document.getElementById('switch-prompt-text');
    const switchAction = document.getElementById('switch-action-btn');

    if (mode === 'register') {
      // Toggle Tabs
      tabRegister.className = "flex-1 py-2.5 rounded-lg font-label-lg text-label-lg transition-all duration-200 text-center shadow-sm bg-surface-container-lowest text-primary";
      tabRegister.setAttribute('aria-selected', 'true');
      tabLogin.className = "flex-1 py-2.5 rounded-lg font-label-lg text-label-lg transition-all duration-200 text-center text-secondary hover:text-on-surface";
      tabLogin.setAttribute('aria-selected', 'false');

      // Expand Name Field
      nameField.classList.remove('hidden');
      nameField.classList.add('flex');

      // Typography update
      authTitle.innerText = "انضم إلى مجتمع اقرأ";
      authSubtitle.innerText = "ابدأ رحلتك لتأسيس عادة قرائية راسخة ومُلهمة";
      submitText.innerText = "إنشاء حسابك الآن";
      forgotLink.classList.add('invisible');

      // Bottom toggle sync
      switchPrompt.innerText = "لديك حساب بالفعل؟";
      switchAction.innerText = "تسجيل الدخول";
    } else {
      // Toggle Tabs
      tabLogin.className = "flex-1 py-2.5 rounded-lg font-label-lg text-label-lg transition-all duration-200 text-center shadow-sm bg-surface-container-lowest text-primary";
      tabLogin.setAttribute('aria-selected', 'true');
      tabRegister.className = "flex-1 py-2.5 rounded-lg font-label-lg text-label-lg transition-all duration-200 text-center text-secondary hover:text-on-surface";
      tabRegister.setAttribute('aria-selected', 'false');

      // Hide Name Field
      nameField.classList.add('hidden');
      nameField.classList.remove('flex');

      // Typography update
      authTitle.innerText = "مرحباً بك مجدداً";
      authSubtitle.innerText = "سجّل دخولك لمواصلة خطتك القرائية وتأملاتك اليومية";
      submitText.innerText = "تسجيل الدخول";
      forgotLink.classList.remove('invisible');

      // Bottom toggle sync
      switchPrompt.innerText = "ليس لديك حساب؟";
      switchAction.innerText = "إنشاء حساب جديد";
    }
  }

  function toggleAuthMode() {
    switchAuthMode(currentMode === 'login' ? 'register' : 'login');
  }

  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('input-password');
    const visibilityIcon = document.getElementById('password-visibility-icon');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      visibilityIcon.innerText = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      visibilityIcon.innerText = 'visibility';
    }
  }
</script></main>

</body></html>
