<!-- Main Creation Form -->
<form class="flex flex-col gap-space-lg" id="createGroupForm" onsubmit="event.preventDefault(); showSuccessSheet();"><!-- Block 1: Group Name & Description -->
<div class="flex flex-col gap-2 p-4 rounded-[16px]" style="background-color: rgb(241, 228, 211); border: 1px solid rgb(205, 170, 133);">
  <label class="text-[15px] font-bold flex items-center justify-between" for="groupName" style="color: #3E2A1E;">
    <span class="">اسم المجموعة ووصفها</span>

  </label>
  <div class="relative">
    <input id="groupName" type="text" value="رفاق الفكر والفلسفة" placeholder="مثال: رفاق الفكر والفلسفة" class="w-full px-4 py-3.5 pr-11 rounded-[16px] text-[15px] focus:outline-none transition-all" style="background-color: #FFFFFF; border: 1.5px solid #CDAA85; color: #3E2A1E; min-height: 48px;" required="">

  </div>
  <textarea rows="2" placeholder="أضف نبذة سريعة عن أهداف المجموعة ومسار القراءة..." class="w-full p-3 text-[14px] rounded-[16px] focus:outline-none transition-all mt-1 resize-none" style="background-color: #FFFFFF; border: 1.5px solid #CDAA85; color: #3E2A1E;">قراءة معمّقة ومناقشات أسبوعية لأمهات كتب الفلسفة والتأمل الإنساني.</textarea>
</div>

<!-- Block 2: Selected Book -->
<div class="flex flex-col gap-2 p-4 rounded-[16px]" style="background-color: rgb(241, 228, 211); border: 1px solid rgb(205, 170, 133);">
  <div class="flex items-center justify-between mb-1">
    <span class="text-[15px] font-bold" style="color: #3E2A1E;">الكتاب المعتمد للتحدي</span>
    <button type="button" class="text-[13px] font-semibold flex items-center gap-1 min-h-[48px] px-2 rounded-[16px] transition-colors" style="color: #4F5D2F;">
      <span class="material-symbols-outlined text-[18px]">sync_alt</span>
      <span class="">تغيير الكتاب</span>
    </button>
  </div>
  <div class="flex items-center gap-3.5 p-3 rounded-[16px]" style="background-color: #FFFFFF; border: 1px solid #CDAA85;">
    <div class="w-14 h-20 rounded-[12px] overflow-hidden shrink-0 shadow-sm" style="border: 1px solid #CDAA85;">
      <img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAs4GnVO8FGUn8CqMs1GYNO51s35RegbTg9E6zCz6iuYKSp5WOTyfQ9jpSCenv1HLinyVFBRVLXEWD2nPXXPEe5iD-HMy6s9Be_ooc0f1DDlbTisqNpLjUyP8RTmYEx0A_gQq3HmkZE7jm_nFgDEIUNajxeSDq5yrTjOGuvT-19jStlplxarx2L5PkWsH7ZM-f3ft3YVUfADHc3UfbyzAf2YvVsRJeXAyO3OHXSXzRXlZ3aT1TMHXU5TQ" alt="غلاف الكتاب">
    </div>
    <div class="flex flex-col flex-1 min-w-0">
      <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full w-fit mb-1" style="background-color: #E2D1BE; color: #4F5D2F;">فلسفة وتأمل • ٣٠ يوماً</span>
      <h3 class="text-[15px] font-bold truncate" style="color: #3E2A1E;">طريق الحكمة وفنون العيش</h3>
      <p class="text-[13px] truncate mt-0.5" style="color: #4F5D2F;">د. عبد الرحمن الفهد • ٣٢٠ صفحة</p>
    </div>
  </div>
</div>

<!-- Block 3: Group Type Selection -->
<div class="flex flex-col gap-2 p-4 rounded-[16px]" style="background-color: rgb(241, 228, 211); border: 1px solid rgb(205, 170, 133);">
  <label class="text-[15px] font-bold mb-1" style="color: #3E2A1E;">نوع المجموعة ومستوى الخصوصية</label>
  <div class="flex flex-col gap-2.5">
    <!-- Option 1: Private (Selected) -->
    <label class="relative flex items-start gap-3 p-3.5 rounded-[16px] cursor-pointer transition-all" style="background-color: #FFFFFF; border: 2px solid #6B4630;">
      <input type="radio" name="privacyType" value="private" checked="" class="sr-only" onchange="updatePrivacyVisuals()">
      <div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5" style="background-color: #6B4630;">
        <div class="w-2 h-2 rounded-full bg-white"></div>
      </div>
      <div class="flex flex-col flex-1">
        <div class="flex items-center gap-1.5">
          <span class="text-[14px] font-bold" style="color: #3E2A1E;">مجموعة خاصة (برمز دعوة فقط)</span>
          <span class="material-symbols-outlined text-[16px]" style="color: #6B4630;">lock</span>
        </div>
        <p class="text-[12px] leading-relaxed mt-1" style="color: #4F5D2F;">الانضمام برمز أو رابط دعوة حصري من المشرف فقط دون ظهور في الدليل العام.</p>
      </div>
    </label>
    <!-- Option 2: Public Open -->
    <label class="relative flex items-start gap-3 p-3.5 rounded-[16px] cursor-pointer transition-all" style="background-color: #FBF6EE; border: 1px solid #CDAA85;">
      <input type="radio" name="privacyType" value="public" class="sr-only" onchange="updatePrivacyVisuals()">
      <div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5" style="border: 1.5px solid #CDAA85; background-color: transparent;">
        <div class="w-2 h-2 rounded-full bg-transparent"></div>
      </div>
      <div class="flex flex-col flex-1">
        <div class="flex items-center gap-1.5">
          <span class="text-[14px] font-bold" style="color: #3E2A1E;">تحدي عام مفتوح لجميع القرّاء</span>
          <span class="material-symbols-outlined text-[16px]" style="color: #4F5D2F;">public</span>
        </div>
        <p class="text-[12px] leading-relaxed mt-1" style="color: #4F5D2F;">متاح لجميع أفراد مجتمع القراءة للمشاركة والتنافس في جداول الإنجاز.</p>
      </div>
    </label>
  </div>
</div>

<!-- Block 4: Primary CTA Button -->
<div class="pt-2">
  <button type="submit" class="w-full flex items-center justify-center gap-2 rounded-[16px] font-bold text-[16px] shadow-md transition-all active:scale-[0.98]" style="min-height: 52px; background: linear-gradient(135deg, #6B4630 0%, #82563C 100%); color: #FFFFFF; border: none;">
    <span class="">تأكيد وإنشاء المجموعة</span>
    <span class="material-symbols-outlined text-[20px]">rocket_launch</span>
  </button>
</div></form>
<!-- Success Bottom Sheet Modal (Toggled upon creation) -->
<div class="fixed inset-0 z-50 bg-inverse-surface/40 backdrop-blur-sm hidden items-end justify-center transition-opacity" id="successModal">
<div class="w-full max-w-lg bg-surface-container-lowest rounded-t-[28px] p-space-lg shadow-2xl flex flex-col gap-space-md transform translate-y-full transition-transform duration-300" id="successSheetContent">
<!-- Sheet Drag Handle -->
<div class="w-12 h-1.5 bg-surface-container-highest rounded-full mx-auto -mt-space-xs mb-space-xs"></div>
<!-- Icon & Headline -->
<div class="flex flex-col items-center text-center gap-space-xs">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed mb-space-xs shadow-sm">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">celebration</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">تم إنشاء مجموعتك بنجاح! 🎉</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs">
          أصبحت مجموعة "رفاق الفكر والفلسفة" جاهزة الآن. شارك الرمز مع أصدقائك لبدء القراءة معاً.
        </p>
</div>
<!-- Generated Code Card -->
<div class="bg-surface-container-low p-space-md rounded-xl flex items-center justify-between shadow-sm">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">رمز الانضمام الحصري:</span>
<span class="font-display-lg text-headline-lg font-bold tracking-wider text-primary select-all" id="groupCode">IQRA-8429</span>
</div>
<button class="h-11 px-space-md bg-surface-container-highest hover:bg-primary-fixed text-on-surface font-label-md text-label-md rounded-xl flex items-center gap-space-xs transition-colors" id="copyCodeBtn" onclick="handleCopyCode()" type="button">
<span class="material-symbols-outlined text-[18px]">content_copy</span>
<span id="copyBtnText" class="">نسخ الرمز</span>
</button>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-space-sm mt-space-xs">
<!-- Share Link Button -->
<button class="w-full h-12 bg-primary-fixed text-on-primary-fixed font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-space-xs hover:bg-primary-fixed-dim transition-colors" onclick="handleShareLink()" type="button">
<span class="material-symbols-outlined text-[20px]">ios_share</span>
<span class="">مشاركة رابط الدعوة المباشر</span>
</button>
<!-- Go To Group Page Button -->
<button class="w-full h-12 bg-primary text-on-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-space-xs shadow-sm hover:opacity-95 transition-opacity" onclick="closeModalAndNavigate()" type="button">
<span class="">الانتقال إلى صفحة المجموعة</span>
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
</div>
</div>
</div>
</div>
<script>
  function selectDuration(button, days) {
    const allButtons = document.querySelectorAll('.duration-btn');
    allButtons.forEach(btn => {
      btn.classList.remove('bg-primary', 'text-on-primary');
      btn.classList.add('bg-surface-container-lowest', 'text-on-surface');
      const sub = btn.querySelector('.text-on-primary\\/80');
      if (sub) {
        sub.classList.remove('text-on-primary/80');
        sub.classList.add('text-on-surface-variant');
      }
    });

    button.classList.remove('bg-surface-container-lowest', 'text-on-surface');
    button.classList.add('bg-primary', 'text-on-primary');
    const sub = button.querySelector('.text-on-surface-variant');
    if (sub) {
      sub.classList.remove('text-on-surface-variant');
      sub.classList.add('text-on-primary/80');
    }
  }

  function updatePrivacyVisuals() {
    const options = document.querySelectorAll('.privacy-option');
    options.forEach(opt => {
      const radio = opt.querySelector('input[type="radio"]');
      const indicator = opt.querySelector('.radio-indicator');
      const dot = indicator.querySelector('div');

      if (radio.checked) {
        opt.classList.remove('bg-surface-container-low');
        opt.classList.add('bg-surface-container-lowest');
        indicator.classList.remove('bg-surface-container-highest');
        indicator.classList.add('bg-primary');
        dot.classList.remove('bg-transparent');
        dot.classList.add('bg-on-primary');
      } else {
        opt.classList.remove('bg-surface-container-lowest');
        opt.classList.add('bg-surface-container-low');
        indicator.classList.remove('bg-primary');
        indicator.classList.add('bg-surface-container-highest');
        dot.classList.remove('bg-on-primary');
        dot.classList.add('bg-transparent');
      }
    });
  }

  function showSuccessSheet() {
    const modal = document.getElementById('successModal');
    const content = document.getElementById('successSheetContent');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    setTimeout(() => {
      content.classList.remove('translate-y-full');
      content.classList.add('translate-y-0');
    }, 20);
  }

  function handleCopyCode() {
    const code = document.getElementById('groupCode').innerText;
    navigator.clipboard?.writeText(code).catch(() => {});
    const btnText = document.getElementById('copyBtnText');
    btnText.innerText = 'تم النسخ بنجاح!';
    setTimeout(() => {
      btnText.innerText = 'نسخ الرمز';
    }, 2000);
  }

  function handleShareLink() {
    if (navigator.share) {
      navigator.share({
        title: 'انضم إلى مجموعة القراءة',
        text: 'انضم إلينا في قراءة "طريق الحكمة وفنون العيش" عبر رمز: IQRA-8429',
        url: window.location.href,
      }).catch(() => {});
    } else {
      handleCopyCode();
    }
  }

  function closeModalAndNavigate() {
    const content = document.getElementById('successSheetContent');
    const modal = document.getElementById('successModal');
    content.classList.add('translate-y-full');
    content.classList.remove('translate-y-0');
    setTimeout(() => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      history.back();
    }, 250);
  }
</script></main>

</body></html>
